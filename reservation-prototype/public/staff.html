<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Purpose PV · Staff</title>
<style>
:root{--green:#263d2d;--paper:#f7f3e9;--line:#ddd5c5;--ink:#262720;--gold:#ad8b54}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 Arial,sans-serif}header{background:var(--green);color:white;padding:18px;text-align:center}header h1{font:26px Georgia;margin:4px}main{max-width:1100px;margin:22px auto;padding:0 14px}.panel,.booking{background:white;border:1px solid var(--line);border-radius:8px;padding:18px;margin:14px 0}.hidden{display:none}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.field{flex:1;min-width:150px}label{display:block;font-size:12px;color:#666;margin-bottom:5px}input,select,textarea,button{font:inherit;padding:10px;border:1px solid var(--line);border-radius:4px;max-width:100%}button{cursor:pointer;background:#fff}button.primary{background:var(--green);color:white;border-color:var(--green)}button:disabled{opacity:.5}.booking{display:grid;grid-template-columns:1fr auto;gap:12px}.muted{color:#6c6b61;font-size:13px}.pill{display:inline-block;background:#efe6d5;padding:3px 8px;border-radius:20px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.editor{grid-column:1/-1;border-top:1px solid var(--line);padding-top:12px}.error{color:#9b2c22}.ok{color:#27623b}@media(max-width:650px){.booking{grid-template-columns:1fr}.editor{grid-column:1}}
</style></head><body><header><small>PURPOSE INDIAN KITCHEN · VERSALLES</small><h1>Staff reservations</h1></header><main>
<section id="login" class="panel"><h2>Staff login</h2><p class="muted">Private access for Purpose staff. Session expires after 8 hours.</p><form id="loginForm" class="row"><div class="field"><label>Staff password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary">Sign in</button></form><p id="loginMsg" class="error"></p></section>
<section id="dashboard" class="hidden"><div class="panel"><div class="row"><div class="field"><label>Reservation date</label><input id="date" type="date"></div><button class="primary" id="load">Load reservations</button><button id="logout">Sign out</button></div><p id="status" class="muted"></p></div><div class="panel"><h2>Add walk-in</h2><form id="walkinForm" class="row"><div class="field"><label>Guest name</label><input id="wiName" placeholder="Walk-in"></div><div class="field"><label>Phone</label><input id="wiPhone"></div><div class="field"><label>Guests</label><select id="wiParty"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></div><div class="field"><label>Arrival</label><select id="wiTime"><option value="17:00">17:00</option><option value="17:30">17:30</option><option value="18:00">18:00</option><option value="18:30">18:30</option><option value="19:00">19:00</option><option value="19:30">19:30</option><option value="20:00">20:00</option><option value="20:30">20:30</option><option value="21:00">21:00</option></select></div><div class="field"><label>Thali guests (Thursday only)</label><input id="wiThali" type="number" min="0" max="8" value="0"></div><button class="primary">Add seated walk-in</button></form></div><div id="list"></div></section>
</main><script>
const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(path,opts={}){const r=await fetch(path,{credentials:"same-origin",...opts,headers:{"content-type":"application/json",...(opts.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||"Request failed");return d}
function show(auth){$("login").classList.toggle("hidden",auth);$("dashboard").classList.toggle("hidden",!auth)}
async function check(){try{const s=await api("/api/admin/session");show(s.authenticated);if(s.authenticated)await load()}catch{show(false)}}
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginMsg").textContent="";try{await api("/api/admin/login",{method:"POST",body:JSON.stringify({password:$("password").value})});$("password").value="";show(true);await load()}catch(err){$("loginMsg").textContent=err.message}};
$("logout").onclick=async()=>{await api("/api/admin/logout",{method:"POST"});show(false)};
$("date").value=new Date().toLocaleDateString("en-CA");$("load").onclick=load;
$("walkinForm").onsubmit=async e=>{e.preventDefault();try{await api("/api/admin/walkins",{method:"POST",body:JSON.stringify({guest_name:$("wiName").value,phone:$("wiPhone").value,party_size:Number($("wiParty").value),thali_count:Number($("wiThali").value),reservation_date:$("date").value,start_time:$("wiTime").value})});$("status").textContent="Walk-in added and marked seated.";await load()}catch(err){$("status").textContent=err.message}};
async function load(){const date=$("date").value;if(!date)return; $("status").textContent="Loading…";try{const d=await api("/api/admin/reservations?date="+encodeURIComponent(date));const tables=await api("/api/tables");window.tableList=tables.tables;$("status").textContent=d.reservations.length+" reservations";$("list").innerHTML=d.reservations.map(r=>card(r)).join("")||'<div class="panel">No reservations for this date.</div>';document.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>save(b.dataset.save));}catch(e){$("status").textContent=e.message}}
function card(r){return '<article class="booking"><div><strong>'+esc(r.start_time)+' · '+esc(r.guest_name)+'</strong> <span class="pill">'+esc(r.status)+'</span><div>'+esc(r.party_size)+' guests · Thali '+esc(r.thali_count)+' · '+esc(r.phone)+'</div><div class="muted">'+esc(r.email||"")+' · '+esc(r.confirmation_code)+'</div><div class="muted">Tables: '+esc((r.table_ids||[]).join(", ")||"Unassigned")+' · '+esc(r.duration_minutes)+' min · '+esc(r.source)+'</div><div class="muted">'+esc(r.special_requests||"No special requests")+'</div></div><div class="actions"><button onclick="this.closest(\'.booking\').querySelector(\'.editor\').classList.toggle(\'hidden\')">Manage</button></div><div class="editor hidden" id="edit-'+esc(r.id)+'"><div class="row"><div class="field"><label>Status</label><select data-status>'+["confirmed","seated","completed","cancelled","no_show"].map(x=>'<option '+(r.status===x?'selected':'')+'>'+x+'</option>').join("")+'</select></div><div class="field"><label>Assigned tables (select multiple)</label><select data-tables multiple size="4">'+(window.tableList||[]).map(t=>'<option value="'+t.id+'" '+((r.table_ids||[]).includes(t.id)?'selected':'')+'>Table '+t.id+' · '+t.capacity+' seats</option>').join("")+'</select></div></div><label>Internal notes</label><textarea data-notes rows="2" style="width:100%">'+esc(r.internal_notes||"")+'</textarea><div class="actions"><button class="primary" data-save="'+esc(r.id)+'">Save changes</button></div></div></article>'}
async function save(id){const el=$("edit-"+id),status=el.querySelector("[data-status]").value,table_ids=[...el.querySelector("[data-tables]").selectedOptions].map(o=>Number(o.value)),internal_notes=el.querySelector("[data-notes]").value;try{await api("/api/reservations/"+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({status,table_ids,internal_notes})});$("status").textContent="Changes saved.";await load()}catch(e){$("status").textContent=e.message}}
check();
</script></body></html>
