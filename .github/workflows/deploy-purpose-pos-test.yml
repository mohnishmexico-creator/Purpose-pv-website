name: Deploy Purpose POS test Worker

on:
  push:
    branches:
      - purpose-pos-prototype
    paths:
      - "pos-prototype/**"
      - ".github/workflows/deploy-purpose-pos-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: purpose-pos-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out POS prototype
        uses: actions/checkout@v4
        with:
          ref: purpose-pos-prototype
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Create or find isolated D1 database
        working-directory: pos-prototype
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "2541ff27a2bb36f951d9b3c6fbc0045a"
        run: |
          set -euo pipefail
          DB_ID="$(wrangler d1 list --json | jq -r '.[] | select(.name == "purpose-pos-test-db") | .uuid' | head -n1)"
          if [ -z "$DB_ID" ]; then
            CREATE_OUTPUT="$(wrangler d1 create purpose-pos-test-db)"
            DB_ID="$(printf '%s\n' "$CREATE_OUTPUT" | grep -Eo '[0-9a-fA-F-]{36}' | head -n1 || true)"
          fi
          test -n "$DB_ID"
          test "$DB_ID" != "null"
          sed -i "s/SET_BY_DEPLOY_WORKFLOW/$DB_ID/" wrangler.toml
          echo "D1 database ready"
      - name: Apply database migrations
        working-directory: pos-prototype
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "2541ff27a2bb36f951d9b3c6fbc0045a"
        run: wrangler d1 execute purpose-pos-test-db --remote --file=./migrations/0001_initial.sql
      - name: Deploy and verify isolated POS Worker
        working-directory: pos-prototype
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "2541ff27a2bb36f951d9b3c6fbc0045a"
        run: |
          set -euo pipefail
          wrangler deploy 2>&1 | tee /tmp/purpose-pos-deploy.log
          URL="$(grep -Eo 'https://[^[:space:]]+\\.workers\\.dev' /tmp/purpose-pos-deploy.log | tail -n1 || true)"
          if [ -z "$URL" ]; then
            echo "::error::Wrangler did not report a workers.dev URL. Check account subdomain and workers_dev settings."
            exit 1
          fi
          echo "Prototype URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          curl --fail --show-error --silent --retry 3 --retry-delay 3 "$URL/health" | tee /tmp/purpose-pos-health.json
          grep -q '"ok":true' /tmp/purpose-pos-health.json
          echo "Health check passed" >> "$GITHUB_STEP_SUMMARY"
      - name: Deployment diagnostics
        if: always()
        run: |
          echo "POS deployment job: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "This is an isolated test Worker. Check Wrangler deployment output for the assigned workers.dev URL." >> "$GITHUB_STEP_SUMMARY"
