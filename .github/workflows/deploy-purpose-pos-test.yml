name: Deploy Purpose POS test Worker

on:
  push:
    branches:
      - purpose-pos-prototype
    paths:
      - "pos-prototype/**"
      - ".github/workflows/deploy-purpose-pos-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: purpose-pos-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out POS prototype
        uses: actions/checkout@v4
        with:
          ref: purpose-pos-prototype
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Create or find isolated D1 database
        working-directory: pos-prototype
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "2541ff27a2bb36f951d9b3c6fbc0045a"
        run: |
          set -euo pipefail
          DB_JSON="$(wrangler d1 list --json)"
          DB_ID="$(echo "$DB_JSON" | jq -r '.[] | select(.name=="purpose-pos-test-db") | .uuid' | head -n1)"
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            CREATE_JSON="$(wrangler d1 create purpose-pos-test-db --json)"
            DB_ID="$(echo "$CREATE_JSON" | jq -r '.uuid // .result.uuid')"
          fi
          test -n "$DB_ID"
          test "$DB_ID" != "null"
          sed -i "s/SET_BY_DEPLOY_WORKFLOW/$DB_ID/" wrangler.toml
          echo "D1 database ready"
      - name: Apply database migrations
        working-directory: pos-prototype
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "2541ff27a2bb36f951d9b3c6fbc0045a"
        run: wrangler d1 execute purpose-pos-test-db --remote --file=./migrations/0001_initial.sql
      - name: Deploy isolated POS Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "2541ff27a2bb36f951d9b3c6fbc0045a"
          workingDirectory: "pos-prototype"
          command: deploy
