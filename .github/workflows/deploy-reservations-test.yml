name: Deploy Purpose reservations test Worker

on:
  workflow_dispatch:
  push:
    branches:
      - reservation-system-prototype

permissions:
  contents: read

concurrency:
  group: purpose-reservations-test-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out prototype branch
        uses: actions/checkout@v4
        with:
          ref: reservation-system-prototype

      - name: Run table allocation unit tests
        run: node --test tests/*.test.mjs
        working-directory: reservation-prototype

      - name: Rebuild reservation overlap guards on test D1
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "2541ff27a2bb36f951d9b3c6fbc0045a"
          workingDirectory: "reservation-prototype"
          command: d1 execute purpose-reservations-test-db --remote --file=migrations/0006_rebuild_conflict_guards.sql

      - name: Verify test D1 overlap guard definitions
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "2541ff27a2bb36f951d9b3c6fbc0045a"
          workingDirectory: "reservation-prototype"
          command: d1 execute purpose-reservations-test-db --remote --command "SELECT name, sql FROM sqlite_master WHERE type='trigger' AND name IN ('prevent_overlapping_table_assignment','prevent_reactivating_conflicting_reservation') ORDER BY name;"

      - name: Deploy isolated test Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "2541ff27a2bb36f951d9b3c6fbc0045a"
          workingDirectory: "reservation-prototype"
          command: deploy

      - name: Validate production Worker bundle without deploying
        run: |
          node --check worker.js
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const guest = fs.readFileSync("public-production/index.html","utf8");
          const staff = fs.readFileSync("public-production/staff.html","utf8");
          if (guest.includes("PRIVATE TEST") || guest.toLowerCase().includes("preview") || guest.includes("tableagent.com")) throw new Error("Production guest assets contain test or TableAgent text");
          if (staff.includes("PRIVATE TEST") || staff.toLowerCase().includes("preview") || staff.includes("tableagent.com")) throw new Error("Production staff assets contain test or TableAgent text");
          if (!guest.includes("purpose-set-language")) throw new Error("Production guest page is missing language synchronization");
          console.log("PASS production assets are clean and bilingual");
          NODE
        working-directory: reservation-prototype

      - name: Dry-run production Worker deployment
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "2541ff27a2bb36f951d9b3c6fbc0045a"
          workingDirectory: "reservation-prototype"
          command: deploy --dry-run --config wrangler.production.toml

      - name: Run read-only HTTP smoke tests against isolated test Worker
        env:
          TEST_BASE_URL: https://purpose-reservations-staging.mohnishmexico.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.TEST_BASE_URL;
          async function check(path, expected, label) {
            const response = await fetch(base + path);
            const body = await response.json().catch(() => ({}));
            if (response.status !== expected) {
              throw new Error(`${label}: expected HTTP ${expected}, received ${response.status}: ${JSON.stringify(body)}`);
            }
            console.log(`PASS ${label}: HTTP ${response.status}`);
            return body;
          }
          const health = await check("/api/health", 200, "health endpoint");
          if (!health.ok || health.mode !== "private-prototype") throw new Error("Health payload mismatch");
          const guest = await fetch(base + "/");
          const guestHtml = await guest.text();
          if (!guest.ok || !guestHtml.includes("Reservations") || !guestHtml.includes("bookingForm")) throw new Error("Guest booking page did not load correctly");
          console.log("PASS guest booking page: HTTP " + guest.status);
          const now = new Date();
          const delta = ((4 - now.getUTCDay() + 7) % 7) || 7;
          now.setUTCDate(now.getUTCDate() + delta);
          const thursday = now.toISOString().slice(0,10);
          const availability = await check("/api/availability?date=" + thursday + "&party_size=2&thali_count=2", 200, "Thursday Thali availability");
          if (availability.thali_hourly_limit !== 12 || !Array.isArray(availability.available_times)) throw new Error("Availability payload mismatch");
          const staff = await fetch(base + "/staff");
          if (!staff.ok || !(await staff.text()).includes("Purpose")) throw new Error("Staff page did not load correctly");
          console.log("PASS staff page: HTTP " + staff.status);
          const session = await check("/api/admin/session", 200, "staff session endpoint");
          if (session.authenticated !== false) throw new Error("Unauthenticated session should not be authenticated");
          await check("/api/admin/reservations?date=" + thursday, 401, "staff reservations API rejects unauthenticated access");
          await check("/api/tables", 401, "table API rejects unauthenticated access");
          const phoneUnauthorized = await fetch(base + "/api/admin/reservations", {method:"POST",headers:{"content-type":"application/json","origin":base},body:JSON.stringify({})});
          if (phoneUnauthorized.status !== 401) throw new Error("Phone reservation creation must require staff authentication");
          const walkinUnauthorized = await fetch(base + "/api/admin/walkins", {method:"POST",headers:{"content-type":"application/json","origin":base},body:JSON.stringify({})});
          if (walkinUnauthorized.status !== 401) throw new Error("Walk-in creation must require staff authentication");
          const badOrigin = await fetch(base + "/api/admin/login", {method:"POST",headers:{"content-type":"application/json","origin":"https://example.invalid"},body:JSON.stringify({password:"invalid-ci-probe"})});
          if (badOrigin.status !== 403) throw new Error("Login must reject cross-origin requests");
          const loginProbe = await fetch(base + "/api/admin/login", {method:"POST",headers:{"content-type":"application/json","origin":base},body:JSON.stringify({password:"invalid-ci-probe"})});
          if (![401,503].includes(loginProbe.status)) throw new Error("Unexpected staff login response: " + loginProbe.status);
          if (loginProbe.status !== 503) throw new Error("Staging Worker should not contain production login secrets");
          const authBase = process.env.TEST_AUTH_BASE_URL;
          if (authBase) {
            const reservedLoginProbe = await fetch(authBase + "/api/admin/login", {method:"POST",headers:{"content-type":"application/json","origin":authBase},body:JSON.stringify({password:"invalid-ci-probe"})});
            if (reservedLoginProbe.status !== 401) throw new Error("Reserved production Worker must retain its configured admin secrets");
            console.log("PASS staging Worker has no production login secrets; reserved production Worker retains them");
          } else {
            console.log("SKIP reserved production login probe after promotion; staging remains isolated");
          }
          console.log("All read-only HTTP smoke tests passed.");
          NODE

      - name: Run browser checks with Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
          node tests/browser-smoke.mjs
        working-directory: reservation-prototype
        env:
          TEST_BASE_URL: https://purpose-reservations-staging.mohnishmexico.workers.dev

      - name: Clear prior CI fixtures from isolated D1
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "2541ff27a2bb36f951d9b3c6fbc0045a"
          workingDirectory: "reservation-prototype"
          command: d1 execute purpose-reservations-test-db --remote --command "DELETE FROM reservation_tables WHERE reservation_id IN (SELECT id FROM reservations WHERE guest_name LIKE 'CI TEST %'); DELETE FROM reservations WHERE guest_name LIKE 'CI TEST %'; DELETE FROM reservation_tables WHERE reservation_id LIKE 'ci-%'; DELETE FROM reservations WHERE id LIKE 'ci-%'; DELETE FROM staff_login_attempts;"

      - name: Run guest booking API integration tests
        run: node tests/http-integration.mjs
        working-directory: reservation-prototype
        env:
          TEST_BASE_URL: https://purpose-reservations-staging.mohnishmexico.workers.dev
          TEST_RUN_ID: ${{ github.run_id }}
          TEST_ADMIN_TOKEN: ci-only-test-token
          TEST_AUTH_BASE_URL: https://purpose-reservations-test.mohnishmexico.workers.dev
          SMTP_TEST_BASE_URL: https://purpose-reservations-test.mohnishmexico.workers.dev

      - name: Apply cancellation, no-show and completion lifecycle transitions
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "2541ff27a2bb36f951d9b3c6fbc0045a"
          workingDirectory: "reservation-prototype"
          command: d1 execute purpose-reservations-test-db --remote --command "UPDATE reservations SET status='cancelled' WHERE guest_name='CI TEST ${{ github.run_id }} A8'; UPDATE reservations SET status='no_show' WHERE guest_name='CI TEST ${{ github.run_id }} B4'; UPDATE reservations SET status='completed' WHERE guest_name='CI TEST ${{ github.run_id }} C2';"

      - name: Verify cancelled, no-show and completed bookings release capacity
        run: node tests/http-lifecycle.mjs
        working-directory: reservation-prototype
        env:
          TEST_BASE_URL: https://purpose-reservations-staging.mohnishmexico.workers.dev
          TEST_RUN_ID: ${{ github.run_id }}

      - name: Seed isolated D1 fixture for reactivation conflict test
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "2541ff27a2bb36f951d9b3c6fbc0045a"
          workingDirectory: "reservation-prototype"
          command: d1 execute purpose-reservations-test-db --remote --command "DELETE FROM reservation_tables WHERE reservation_id IN ('ci-reactivate-a','ci-reactivate-b'); DELETE FROM reservations WHERE id IN ('ci-reactivate-a','ci-reactivate-b'); INSERT INTO reservations (id,confirmation_code,guest_name,phone,party_size,thali_count,reservation_date,start_time,duration_minutes,end_date,end_time,status,source,language) VALUES ('ci-reactivate-a','CI-REACT-A','CI Reactivation A','000',2,0,'2099-01-01','17:00',120,'2099-01-01','19:00','cancelled','staff','en'); INSERT INTO reservations (id,confirmation_code,guest_name,phone,party_size,thali_count,reservation_date,start_time,duration_minutes,end_date,end_time,status,source,language) VALUES ('ci-reactivate-b','CI-REACT-B','CI Reactivation B','000',2,0,'2099-01-01','18:00',120,'2099-01-01','20:00','confirmed','staff','en'); INSERT INTO reservation_tables (reservation_id,table_id) VALUES ('ci-reactivate-a',4); INSERT INTO reservation_tables (reservation_id,table_id) VALUES ('ci-reactivate-b',4);"

      - name: Verify conflicting reservation cannot be reactivated
        id: reactivation_attempt
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "2541ff27a2bb36f951d9b3c6fbc0045a"
          workingDirectory: "reservation-prototype"
          command: d1 execute purpose-reservations-test-db --remote --command "UPDATE reservations SET status='confirmed' WHERE id='ci-reactivate-a';"

      - name: Assert reactivation was blocked by the overlap trigger
        if: always() && steps.reactivation_attempt.outcome != 'skipped'
        run: |
          if [ "${{ steps.reactivation_attempt.outcome }}" != "failure" ]; then
            echo "Expected the D1 overlap trigger to reject reactivation."
            exit 1
          fi
          echo "PASS conflicting cancelled reservation cannot be reactivated"

      - name: Verify failed reactivation left reservation cancelled
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "2541ff27a2bb36f951d9b3c6fbc0045a"
          workingDirectory: "reservation-prototype"
          command: d1 execute purpose-reservations-test-db --remote --command "CREATE TABLE IF NOT EXISTS ci_assertion (ok INTEGER CHECK(ok=1)); DELETE FROM ci_assertion; INSERT INTO ci_assertion SELECT CASE WHEN (SELECT status FROM reservations WHERE id='ci-reactivate-a')='cancelled' THEN 1 ELSE 0 END; DROP TABLE ci_assertion;"

      - name: Final cleanup and verify dining tables are preserved
        if: always()
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "2541ff27a2bb36f951d9b3c6fbc0045a"
          workingDirectory: "reservation-prototype"
          command: d1 execute purpose-reservations-test-db --remote --command "DELETE FROM reservation_tables WHERE reservation_id IN (SELECT id FROM reservations WHERE guest_name LIKE 'CI TEST %') OR reservation_id IN ('ci-reactivate-a','ci-reactivate-b'); DELETE FROM reservations WHERE guest_name LIKE 'CI TEST %' OR id IN ('ci-reactivate-a','ci-reactivate-b'); DELETE FROM staff_login_attempts; CREATE TABLE IF NOT EXISTS ci_assertion (ok INTEGER CHECK(ok=1)); DELETE FROM ci_assertion; INSERT INTO ci_assertion SELECT CASE WHEN (SELECT COUNT(*) FROM dining_tables)=9 AND (SELECT COUNT(*) FROM reservations)=0 AND (SELECT COUNT(*) FROM reservation_tables)=0 THEN 1 ELSE 0 END; DROP TABLE ci_assertion;"
