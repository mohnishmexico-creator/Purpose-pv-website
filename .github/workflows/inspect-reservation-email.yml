name: Inspect isolated reservation email error
on:
  push:
    branches:
      - reservation-system-prototype
    paths:
      - .github/workflows/inspect-reservation-email.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reservation-system-prototype
      - name: Read latest test reservations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "2541ff27a2bb36f951d9b3c6fbc0045a"
          command: d1 execute purpose-reservations-test-db --remote --command "SELECT confirmation_code,guest_name,reservation_date,start_time,email_status,email_error,email_sent_at,created_at FROM reservations ORDER BY created_at DESC LIMIT 5;"
