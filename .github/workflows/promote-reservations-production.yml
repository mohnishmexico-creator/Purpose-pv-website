name: Promote Purpose reservations Worker

on:
  push:
    branches:
      - reservation-system-prototype
    paths:
      - reservation-prototype/production-deploy.trigger
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: purpose-reservations-production-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out prototype branch
        uses: actions/checkout@v4
        with:
          ref: reservation-system-prototype

      - name: Verify production D1 is empty before promotion
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "2541ff27a2bb36f951d9b3c6fbc0045a"
          workingDirectory: "reservation-prototype"
          command: d1 execute purpose-reservations-production-db --remote --command "CREATE TABLE IF NOT EXISTS ci_assertion (ok INTEGER CHECK(ok=1)); DELETE FROM ci_assertion; INSERT INTO ci_assertion SELECT CASE WHEN (SELECT COUNT(*) FROM dining_tables)=9 AND (SELECT SUM(capacity) FROM dining_tables)=36 AND (SELECT COUNT(*) FROM reservations)=0 AND (SELECT COUNT(*) FROM reservation_tables)=0 THEN 1 ELSE 0 END; DROP TABLE ci_assertion;"

      - name: Promote tested Worker code to production D1 and assets
        id: production_deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "2541ff27a2bb36f951d9b3c6fbc0045a"
          workingDirectory: "reservation-prototype"
          command: deploy --config wrangler.production.toml

      - name: Verify production Worker health, guest page, availability and staff security
        id: production_smoke
        run: |
          node --input-type=module <<'NODE'
          const base = "https://purpose-reservations-test.mohnishmexico.workers.dev";
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          const healthResponse = await fetch(base + "/api/health");
          const health = await healthResponse.json();
          assert(healthResponse.ok && health.ok && health.mode === "production", "Production health endpoint did not report production mode: " + JSON.stringify(health));
          const guestResponse = await fetch(base + "/");
          const guestHtml = await guestResponse.text();
          assert(guestResponse.ok && guestHtml.includes("bookingForm") && !guestHtml.includes("PRIVATE TEST") && !guestHtml.toLowerCase().includes("preview"), "Production guest page is not cleanly published");
          const now = new Date(); const delta = ((4-now.getUTCDay()+7)%7)||7; now.setUTCDate(now.getUTCDate()+delta);
          const date = now.toISOString().slice(0,10);
          const availabilityResponse = await fetch(base + "/api/availability?date=" + date + "&party_size=2&thali_count=2");
          const availability = await availabilityResponse.json();
          assert(availabilityResponse.ok && availability.thali_hourly_limit === 12 && Array.isArray(availability.available_times), "Production availability API failed");
          assert(availability.available_times.at(-1) === "20:00" && availability.available_times.every(t => t <= "20:00"), "Production availability must stop at the 8 pm final arrival");
          const eventAvailabilityResponse = await fetch(base + "/api/availability?date=2026-11-15&party_size=2");
          const eventAvailability = await eventAvailabilityResponse.json();
          assert(eventAvailabilityResponse.ok && !eventAvailability.available_times.includes("17:00") && !eventAvailability.available_times.includes("17:30") && !eventAvailability.available_times.includes("18:00") && eventAvailability.available_times.includes("18:30"), "Nov 15 private event block must hide arrivals before 6:30 pm and reopen at 6:30 pm: " + JSON.stringify(eventAvailability));
          const blockedBookingResponse = await fetch(base + "/api/reservations", {method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({guest_name:"Private Event Block Verification",phone:"+523221090525",email:"info@purposepv.com",party_size:2,reservation_date:"2026-11-15",start_time:"18:00",language:"en"})});
          assert(blockedBookingResponse.status === 409, "Nov 15 6:00 pm booking must be rejected during the private event");
          const reopenBookingResponse = await fetch(base + "/api/reservations", {method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({guest_name:"Private Event Reopen Verification",phone:"+523221090525",email:"info@purposepv.com",party_size:2,reservation_date:"2026-11-15",start_time:"18:30",language:"en"})});
          assert(reopenBookingResponse.status === 201, "Nov 15 6:30 pm must accept a reservation after the private event");
          const reopenBooking = await reopenBookingResponse.json();
          console.log("PASS Nov 15 private event block and 6:30 pm reopening, test confirmation " + reopenBooking.confirmation_code);
          assert(guestHtml.includes("Standard seating: 120 minutes for all parties") && !guestHtml.includes("90 minutes"), "Production guest page must show 120-minute seating for all parties");
          const staffResponse = await fetch(base + "/staff");
          const staffHtml = await staffResponse.text();
          assert(staffResponse.ok && staffHtml.includes("Purpose"), "Production staff page failed");
          assert(staffHtml.includes('value="20:00"') && !staffHtml.includes('value="20:30"') && !staffHtml.includes('value="21:00"'), "Production staff forms must end arrivals at 8 pm");
          const adminResponse = await fetch(base + "/api/admin/reservations?date=" + date);
          assert(adminResponse.status === 401, "Production staff API must reject unauthenticated requests");
          const testEndpoint = await fetch(base + "/api/test/smtp", {method:"POST",headers:{"content-type":"application/json","origin":base},body:"{}"});
          assert(testEndpoint.status === 404, "Test-only SMTP endpoint must be disabled in production");
          console.log("PASS production health, clean guest page, availability, staff page, unauthorised access, configured login and disabled test endpoint");
          NODE

      - name: Roll back Worker to private prototype if production verification fails
        if: failure() && steps.production_deploy.outcome == 'success' && steps.production_smoke.outcome == 'failure'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "2541ff27a2bb36f951d9b3c6fbc0045a"
          workingDirectory: "reservation-prototype"
          command: deploy --config wrangler.rollback.toml
