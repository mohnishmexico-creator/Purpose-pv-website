name: Apply Purpose reservations email migration (test only)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/migrate-reservations-email-test.yml

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out prototype branch
        uses: actions/checkout@v4
        with:
          ref: reservation-system-prototype

      - name: Verify token format and apply email tracking migration
        working-directory: reservation-prototype
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2541ff27a2bb36f951d9b3c6fbc0045a
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$RAW_CLOUDFLARE_API_TOKEN" | tr -d '\r\n')"
          TOKEN="${TOKEN#Bearer }"
          TOKEN="${TOKEN#bearer }"
          if [ -z "$TOKEN" ]; then echo 'Cloudflare token secret is empty'; exit 1; fi
          echo "Token format check: non-empty; Bearer prefix removed if present; character count $(printf '%s' "$TOKEN" | wc -c | tr -d ' ')"
          RESPONSE="$(curl -sS https://api.cloudflare.com/client/v4/user/tokens/verify -H "Authorization: Bearer $TOKEN")"
          echo "$RESPONSE" | jq '{success: .success, errors: .errors, status: .result.status}'
          echo "$RESPONSE" | jq -e '.success == true' >/dev/null
          export CLOUDFLARE_API_TOKEN="$TOKEN"
          npx --yes wrangler@3.90.0 d1 execute purpose-reservations-test-db --remote --file=migrations/0004_email_delivery.sql