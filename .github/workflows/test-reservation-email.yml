name: Verify Purpose reservation confirmation email

on:
  push:
    branches:
      - reservation-system-prototype
    paths:
      - .github/workflows/test-reservation-email.yml

permissions:
  contents: read

jobs:
  test-reservation:
    runs-on: ubuntu-latest
    steps:
      - name: Create one isolated test reservation and send confirmation
        env:
          TEST_EMAIL: mohnishmexico@gmail.com
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://purpose-reservations-test.mohnishmexico.workers.dev/api/reservations" \
            --header "Content-Type: application/json" \
            --data-raw '{
              "guest_name":"TEST Guest",
              "phone":"+52 322 109 0525",
              "email":"mohnishmexico@gmail.com",
              "party_size":2,
              "reservation_date":"2026-11-19",
              "start_time":"17:00",
              "thali_count":1,
              "language":"en",
              "special_requests":"TEST ONLY - reservation system verification"
            }'
